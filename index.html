<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Hitster Rioplatense</title>
<style>
  :root {
    --bg: #0b0b12; --fg: #f5f5f7; --muted: #9a9aae;
    --pink: #ff4fa3; --cyan: #34d1f5; --purple: #b07cff; --yellow: #ffd93b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center; overflow: hidden;
    background-image: radial-gradient(circle at 50% 50%, transparent 30%, rgba(176,124,255,.08) 31%, transparent 33%,
      transparent 44%, rgba(52,209,245,.08) 45%, transparent 47%, transparent 58%, rgba(255,79,163,.08) 59%, transparent 61%); }
  .screen { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 420px; }
  .screen.on { display: flex; }
  h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; color: var(--muted); line-height: 1.4; }
  .big { font-size: 1.4rem; color: var(--fg); font-weight: 700; }
  button { font: inherit; font-weight: 800; font-size: 1.15rem; border: 0; border-radius: 999px;
    padding: 16px 32px; cursor: pointer; color: #111; background: var(--yellow); min-width: 220px; }
  button.ghost { background: transparent; color: var(--fg); border: 2px solid #3a3a4a; font-size: 1rem; }
  #video { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 24px; border: 3px solid var(--cyan); background: #000; }
  .phone { width: 90px; height: 150px; border: 6px solid var(--fg); border-radius: 18px; position: relative;
    animation: flip 2.2s ease-in-out infinite; }
  .phone::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 24px; height: 4px; margin-left: -12px;
    border-radius: 2px; background: var(--fg); }
  @keyframes flip { 0%, 30% { transform: rotateY(0); } 60%, 100% { transform: rotateY(180deg); opacity: .35; } }
  .eq { display: flex; gap: 8px; height: 90px; align-items: flex-end; }
  .eq i { width: 16px; border-radius: 8px; background: var(--pink); animation: eq 0.9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { background: var(--purple); animation-delay: .2s; }
  .eq i:nth-child(3) { background: var(--cyan); animation-delay: .4s; }
  .eq i:nth-child(4) { background: var(--yellow); animation-delay: .1s; }
  .eq.paused i { animation-play-state: paused; }
  @keyframes eq { from { height: 20%; } to { height: 100%; } }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .row button { min-width: 0; }
  /* The Spotify player has to exist to play, but nobody should see it. */
  #playerBox { position: fixed; left: 0; bottom: 0; width: 300px; height: 80px; pointer-events: none;
    opacity: 0; z-index: -1; }
</style>
</head>
<body>

<section class="screen on" id="s-start">
  <h1>Hitster Rioplatense</h1>
  <p>Lee las cartas propias y las del juego original.</p>
  <button id="btn-start">Empezar</button>
</section>

<section class="screen" id="s-scan">
  <p class="big">Escaneá una carta</p>
  <video id="video" playsinline muted></video>
  <p id="scan-msg">&nbsp;</p>
</section>

<section class="screen" id="s-flip">
  <div class="phone"></div>
  <p class="big">Poné el celular boca abajo</p>
  <p id="flip-msg">La canción empieza cuando lo des vuelta.</p>
  <button class="ghost" id="btn-play-now">Reproducir sin dar vuelta</button>
</section>

<section class="screen" id="s-tap">
  <p class="big">Tocá para que suene</p>
  <p>El navegador no deja arrancar la música solo.</p>
  <button id="btn-tap-play">▶ Reproducir</button>
</section>

<section class="screen" id="s-play">
  <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
  <p class="big">Sonando…</p>
  <div class="row">
    <button class="ghost" id="btn-pause">Pausa</button>
    <button class="ghost" id="btn-replay">Desde el inicio</button>
  </div>
  <button id="btn-next">Siguiente carta</button>
</section>

<div id="playerBox"><div id="player"></div></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="songs.js"></script>
<script src="official.js"></script>
<script>
const $ = id => document.getElementById(id);
const show = id =>document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));

// ---- QR codes -------------------------------------------------------------
// Own cards:      "HRP:<n>"
// Official cards: a hitstergame.com link ending in the card number. We only own
// one edition (Argentina, AR01), so the number alone picks the song.
function videoFor(code) {
  const own = /^HRP:(\d+)$/.exec(code.trim());
  if (own) return { id: SONGS[own[1]], what: "carta propia " + own[1] };
  const off = /hitstergame\.com\/.*?(\d+)\/?$/i.exec(code.trim());
  if (off) {
    const n = String(parseInt(off[1], 10));
    return { id: OFFICIAL[n], what: `carta oficial ${n} (${code})` };
  }
  return null;
}

// ---- Camera ---------------------------------------------------------------
let stream = null, scanning = false;
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

async function startScan() {
  show("s-scan");
  $("scan-msg").textContent = " ";
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (e) {
    $("scan-msg").textContent = "No se pudo abrir la cámara. Revisá los permisos del navegador.";
    return;
  }
  const v = $("video");
  v.srcObject = stream;
  await v.play();
  scanning = true;
  requestAnimationFrame(tick);
}

function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

let lastScan = 0;
function tick(t) {
  if (!scanning) return;
  const v = $("video");
  if (t - lastScan > 120 && v.readyState >= 2) {
    lastScan = t;
    const w = 480, h = Math.round(480 * v.videoHeight / v.videoWidth);
    canvas.width = w; canvas.height = h;
    ctx.drawImage(v, 0, 0, w, h);
    const qr = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
    if (qr && qr.data) onCode(qr.data);
  }
  if (scanning) requestAnimationFrame(tick);
}

function onCode(code) {
  const hit = videoFor(code);
  if (!hit) { $("scan-msg").textContent = "Ese QR no es una carta de Hitster."; return; }
  if (!hit.id) { $("scan-msg").textContent = `No tengo la canción de la ${hit.what}.`; return; }
  stopScan();
  navigator.vibrate?.(80);
  load(hit.id);
  show("s-flip");
  waitForFaceDown();
}

// ---- Face-down detection --------------------------------------------------
// Two sensors, either one is enough: orientation (beta near ±180 = face down)
// and gravity on the screen axis flipping sign. Some browsers (Brave) block one.
let faceDownSince = 0, watching = false, lastSensor = 0, baseZ = 0;

function faceDown(down) {
  lastSensor = performance.now();
  if (!watching) return;
  if (!down) { faceDownSince = 0; return; }
  if (!faceDownSince) faceDownSince = performance.now();
  else if (performance.now() - faceDownSince > 300) { watching = false; play(); }
}

function onOrientation(e) {
  if (e.beta != null) faceDown(Math.abs(e.beta) > 140);
}

function onMotion(e) {
  const z = e.accelerationIncludingGravity?.z;
  if (z == null) return;
  // The z sign differs between Android and iPhone, so compare against how the
  // phone was held while scanning (screen up-ish).
  if (!baseZ && Math.abs(z) > 3) baseZ = Math.sign(z);
  if (baseZ) faceDown(z * baseZ < -7);
}

function waitForFaceDown() {
  faceDownSince = 0; watching = true; baseZ = 0;
  const since = performance.now();
  $("flip-msg").textContent = "La canción empieza cuando lo des vuelta.";
  $("btn-play-now").className = "ghost";
  setTimeout(() => {
    if (watching && lastSensor < since) {
      $("flip-msg").textContent = "El navegador no deja usar el sensor de movimiento. Tocá el botón y después dalo vuelta.";
      $("btn-play-now").className = "";
    }
  }, 2000);
}

async function askMotionPermission() {
  // iOS only grants motion access from inside a tap.
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  }
  if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
    try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
  }
}
window.addEventListener("deviceorientation", onOrientation);
window.addEventListener("devicemotion", onMotion);

// ---- Player ---------------------------------------------------------------
// Spotify's embeddable player: plays the 30-second preview, no login, no ads.
let ctrl = null, isPlaying = false, startedAt = 0;

window.onSpotifyIframeApiReady = api => {
  const first = Object.values(OFFICIAL)[0] || Object.values(SONGS)[0];
  api.createController($("player"), { uri: "spotify:track:" + first, width: 300, height: 80 }, c => {
    ctrl = c;
    c.addListener("playback_update", e => {
      isPlaying = !e.data.isPaused && e.data.position > 0;
      $("eq").classList.toggle("paused", !isPlaying);
      $("btn-pause").textContent = isPlaying ? "Pausa" : "Seguir";
      if (isPlaying && $("s-tap").classList.contains("on")) show("s-play");
    });
  });
};
const sp = document.createElement("script");
sp.src = "https://open.spotify.com/embed/iframe-api/v1";
document.head.appendChild(sp);

function load(id) {
  if (!ctrl) { setTimeout(() => load(id), 300); return; }
  isPlaying = false;
  ctrl.loadUri("spotify:track:" + id);
}

function play() {
  if (!ctrl) { setTimeout(play, 300); return; }
  watching = false;
  ctrl.play();
  const started = startedAt = performance.now();
  show("s-play");
  // If the browser refuses to start sound without a tap, ask for one.
  const check = () => {
    if (startedAt !== started || isPlaying) return;
    if (performance.now() - started < 4000) { setTimeout(check, 500); return; }
    show("s-tap");
  };
  setTimeout(check, 1000);
}

$("btn-start").onclick = async () => {
  await askMotionPermission();
  try { await navigator.wakeLock?.request("screen"); } catch (e) {}
  startScan();
};
$("btn-play-now").onclick = play;
$("btn-tap-play").onclick = () => ctrl.play();
$("btn-pause").onclick = () => ctrl.togglePlay();
$("btn-replay").onclick = () => { ctrl.seek(0); ctrl.resume(); };
$("btn-next").onclick = () => { ctrl.pause(); startScan(); };
</script>
</body>
</html>
